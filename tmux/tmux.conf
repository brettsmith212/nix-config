set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -ga terminal-overrides ",*:RGB"

# ssh clipboard works with remote nvim
set -g set-clipboard on
set -s set-clipboard on
set -g allow-passthrough all

set -g focus-events on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# resize panes
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R
bind -r C-h resize-pane -L

bind -r m resize-pane -Z
bind z resize-pane -Z

# window management
bind c new-window
bind n next-window
bind p previous-window
bind x kill-pane
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# LLM popup - persistent per-directory session
# toggle: ctrl+a y (opens popup or closes it if already inside)
set -g @llm_session_prefix 'llm-'
set -g @llm_command 'opencode'
set -g @llm_popup_width '95%'
set -g @llm_popup_height '95%'
set -g @llm_warm_cap '5'

bind -r y if-shell -F "#{m:llm-*,#{session_name}}" \
  "detach-client" \
  "run-shell 'llmux launch \"#{pane_current_path}\" \"#{window_id}\"'"

# LLM session picker
bind -r u run-shell 'llmux list'

set -g mouse on
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
