set -g default-terminal "xterm-256color"
set -ga terminal-overrides ',xterm-256color:Tc'
set -ga terminal-overrides ",*:RGB"
set -g theme light
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=themelightgrey'

# ssh clipboard works with remote nvim
set -g set-clipboard on
set -s set-clipboard on
set -g allow-passthrough all

set -g focus-events on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind \\ split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# resize panes
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R
bind -r C-h resize-pane -L

bind -r m resize-pane -Z
bind z resize-pane -Z

# window management
bind c new-window
bind n next-window
bind p previous-window
bind x kill-pane
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E 'EDITOR=nvim lazygit'

# LLM popup - persistent per-directory session
# toggle: ctrl+a y (opens popup or closes it if already inside)
set -g @llm_session_prefix 'llm-'
set -g @llm_command 'opencode'
set -g @llm_agents 'opencode claude amp codex'
set -g @llm_popup_width '95%'
set -g @llm_popup_height '95%'
set -g @llm_warm_cap '5'

# No -r on y/u: a repeatable binding keeps tmux in the prefix table for
# repeat-time, so j/k/g typed right after opening the control room would run
# their own -r bindings (pane switching, lazygit) instead of reaching the picker.
bind y if-shell -F "#{m:llm-*,#{session_name}}" \
  "detach-client" \
  "run-shell 'llmux launch \"#{pane_current_path}\" \"#{session_name}\"'"

# LLM session picker
bind u run-shell 'llmux list "#{client_name}"'

set -g mouse on
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
